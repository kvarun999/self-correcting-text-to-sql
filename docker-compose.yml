services:
  db:
    image: postgres:15-alpine
    container_name: text2sql_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_messy
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/seed_db.sql:/docker-entrypoint-initdb.d/seed_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_messy"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: text2sql_api
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=ecommerce_messy
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_key_here}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./api:/app/api
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./tests:/app/tests
      - ./results:/app/results
    depends_on:
      db:
        condition: service_healthy
